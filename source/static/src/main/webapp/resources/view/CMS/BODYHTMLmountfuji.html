<div id="t3dCanvasHost" style="width: 100%; height: 600px; position: relative; margin: 0 0 16px 0;">
  <div id="t3dStatus" style="display: none; position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); color: #fff; padding: 8px 12px; border-radius: 4px; font-size: 12px; z-index: 1000;">Loading scene...</div>
  <div id="t3dInfoPanel" style="display: none; position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; padding: 12px; border-radius: 4px; font-size: 12px; max-width: 200px; z-index: 1000; line-height: 1.5;"></div>
  <button id="t3dFullscreenBtn" style="position: absolute; bottom: 8px; right: 8px; background: #1a73e8; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; z-index: 500;">Fullscreen</button>
</div>
<div id="t3dP20Controls" style="display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap;">
  <label style="display: flex; align-items: center; gap: 6px;">
    <input type="checkbox" id="toggle-snow" checked style="width: 18px; height: 18px; cursor: pointer;">
    <span style="font-size: 14px; cursor: pointer;">Snow Cap</span>
  </label>
  <label style="display: flex; align-items: center; gap: 6px;">
    <input type="checkbox" id="toggle-forest" checked style="width: 18px; height: 18px; cursor: pointer;">
    <span style="font-size: 14px; cursor: pointer;">Forest Banding</span>
  </label>
</div>
